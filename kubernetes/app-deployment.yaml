apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-app


spec:

  replicas: 2


  selector:

    matchLabels:

      app: student-app



  template:


    metadata:

      labels:

        app: student-app



    spec:


      containers:


      - name: student-app


        image: ajithkumar242/student-management:latest


        imagePullPolicy: Always



        ports:


        - containerPort: 5000




        env:


        - name: DB_HOST

          value: mysql-service



        - name: DB_USER

          valueFrom:

            secretKeyRef:

              name: mysql-secret

              key: MYSQL_USER



        - name: DB_PASSWORD

          valueFrom:

            secretKeyRef:

              name: mysql-secret

              key: MYSQL_PASSWORD



        - name: DB_NAME

          valueFrom:

            secretKeyRef:

              name: mysql-secret

              key: MYSQL_DATABASE